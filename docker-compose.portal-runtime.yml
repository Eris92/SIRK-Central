services:
  central:
    build:
      context: .
      dockerfile: Dockerfile.portal-runtime
    environment:
      SIRK_BACKUP_MANAGER_ORIGIN: http://backup-manager:8091
    depends_on:
      backup-manager:
        condition: service_healthy

  backup-manager:
    build:
      context: .
      dockerfile: updater/Dockerfile
    restart: unless-stopped
    command: ["node", "/app/management-server.js"]
    environment:
      SIRK_UPDATER_TOKEN: ${SIRK_UPDATER_TOKEN}
      SIRK_BACKUP_MANAGER_BIND_HOST: 0.0.0.0
      SIRK_BACKUP_MANAGER_PORT: 8091
      SIRK_UPDATER_STATE_DIR: /var/lib/sirk-updater
      SIRK_BACKUP_SOURCE_DIR: /var/lib/sirk-central
      SIRK_BACKUP_DIR: /var/lib/sirk-updater/backups
      SIRK_BACKUP_TIME_ZONE: ${SIRK_BACKUP_TIME_ZONE:-Europe/Warsaw}
      SIRK_BACKUP_MAX_ARCHIVE_BYTES: ${SIRK_BACKUP_MAX_ARCHIVE_BYTES:-53687091200}
      SIRK_BACKUP_MAX_ENTRIES: ${SIRK_BACKUP_MAX_ENTRIES:-100000}
    volumes:
      - central-data:/var/lib/sirk-central:ro
      - updater-state:/var/lib/sirk-updater
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
