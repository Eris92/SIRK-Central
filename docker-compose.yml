services:
  central:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIRK_CENTRAL_IMAGE:-sirk-central:dotnet10}
    container_name: ${SIRK_CENTRAL_CONTAINER:-sirk-central}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: "${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com};localhost;127.0.0.1"
      Sirk__ReverseProxy__TrustAll: "true"
      Sirk__PortalProtocol__DataRoot: /var/lib/sirk-central
      Sirk__PublicSite__SnapshotPath: /var/lib/sirk-public/sirk-config.json
      Sirk__PublicSite__PublicDomain: "${SIRK_WEBSITE_DOMAIN:-sirkportal.com}"
      Sirk__Demo__OrchestratorUrl: http://demo-orchestrator:8090
      Sirk__Demo__ControlTokenFile: /run/secrets/sirk-demo-control-token
      Sirk__Demo__PublicBaseUrl: "https://${SIRK_DEMO_DOMAIN:-demo.sirkportal.com}"
      Sirk__AgentUpdates__PublicBaseUrl: "https://${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}"
      Sirk__AgentUpdates__GitHubRepository: "${SIRK_AGENT_UPDATE_REPOSITORY:-Eris92/SIRK-Agent}"
      Sirk__AgentUpdates__GitHubTokenFile: /run/secrets/sirk-agent-updates-github-token
      Sirk__AgentUpdates__CacheRoot: /var/lib/sirk/updates/agent
      Sirk__AgentUpdates__MetadataTtlSeconds: "300"
      Sirk__AgentUpdates__Retention: "3"
      Sirk__Security__Enabled: "true"
      Sirk__Security__DataRoot: /var/lib/sirk-central/security
      Sirk__Security__BootstrapSecretFile: /var/lib/sirk-central/security/break-glass-bootstrap.json
      Sirk__Security__DataProtectionCertificatePath: /run/secrets/sirk-central-dataprotection.pfx
      Sirk__Security__DataProtectionCertificatePasswordFile: /run/secrets/sirk-central-dataprotection-password
      Sirk__Security__ReleaseSigningPublicKeyFile: /run/secrets/sirk-release-signing-public-key
      Sirk__Security__RequireProtectedDataProtectionKeys: "true"
      Sirk__Security__RequireSignedReleases: "true"
      Sirk__Security__RequireSingleWriterLease: "true"
      Sirk__Security__SessionMinutes: "30"
      Sirk__Security__LoginAttemptsPerFiveMinutes: "5"
      Sirk__Security__PasswordHashIterations: "600000"
      Sirk__WebAuthn__ServerDomain: "${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}"
      Sirk__WebAuthn__ServerName: "SIRK Central"
      Sirk__WebAuthn__Origins__0: "https://${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}"
    volumes:
      - sirk-central-data:/var/lib/sirk-central
      - sirk-public-config:/var/lib/sirk-public
      - sirk-agent-update-cache:/var/lib/sirk/updates/agent
      - ${SIRK_CENTRAL_SECRETS_PATH:-./secrets}:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "dotnet", "Sirk.Central.dll", "--health-check", "http://127.0.0.1:8080/readyz"]
      interval: 20s
      timeout: 7s
      start_period: 10s
      retries: 3
    networks:
      - sirk-edge

  demo-orchestrator:
    image: ${SIRK_CENTRAL_IMAGE:-sirk-central:dotnet10}
    container_name: ${SIRK_DEMO_ORCHESTRATOR_CONTAINER:-sirk-demo-orchestrator}
    command: ["--demo-orchestrator"]
    restart: unless-stopped
    user: "0:0"
    expose:
      - "8090"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Sirk__Demo__ControlTokenFile: /run/secrets/sirk-demo-control-token
      Sirk__Demo__PortalImage: "${SIRK_PORTAL_DEMO_IMAGE:-ghcr.io/eris92/sirk-portal}"
      Sirk__Demo__Network: sirk-demo
      Sirk__Demo__PublicBaseUrl: "https://${SIRK_DEMO_DOMAIN:-demo.sirkportal.com}"
      Sirk__Demo__DockerSocket: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SIRK_CENTRAL_SECRETS_PATH:-./secrets}:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - sirk-edge
      - sirk-demo

  caddy:
    image: caddy:2.10.0-alpine
    container_name: ${SIRK_CADDY_CONTAINER:-sirk-caddy}
    restart: unless-stopped
    depends_on:
      central:
        condition: service_healthy
      demo-orchestrator:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SIRK_ACME_EMAIL: "${SIRK_ACME_EMAIL:-admin@example.com}"
      SIRK_WEBSITE_DOMAIN: "${SIRK_WEBSITE_DOMAIN:-sirkportal.com}"
      SIRK_BUSINESS_DOMAIN: "${SIRK_BUSINESS_DOMAIN:-sir-k.pl}"
      SIRK_DEMO_DOMAIN: "${SIRK_DEMO_DOMAIN:-demo.sirkportal.com}"
      SIRK_CENTRAL_DOMAIN: "${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}"
      SIRK_AUTH_DOMAIN: "${SIRK_AUTH_DOMAIN:-auth.sirkportal.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - sirk-public-config:/srv/public-config:ro
      - ${SIRK_BUSINESS_SITE_PATH:-./website}:/srv/sir-k:ro
      - sirk-caddy-data:/data
      - sirk-caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - sirk-edge

networks:
  sirk-edge:
    driver: bridge
  sirk-demo:
    name: sirk-demo
    driver: bridge
    internal: true

volumes:
  sirk-central-data:
  sirk-public-config:
  sirk-agent-update-cache:
  sirk-caddy-data:
  sirk-caddy-config:
