services:
  central:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SIRK_BIND_HOST: 0.0.0.0
      SIRK_PUBLIC_ORIGIN: https://${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}
      SIRK_AUTH_ORIGIN: ${SIRK_AUTH_ORIGIN:-}
      SIRK_SSO_SHARED_SECRET: ${SIRK_SSO_SHARED_SECRET:-}
      SIRK_UPDATER_ORIGIN: http://updater:8090
    volumes:
      - central-data:/var/lib/sirk-central
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  auth:
    profiles: ["auth"]
    build: .
    restart: unless-stopped
    command: ["node", "auth/server.js"]
    env_file: .env
    environment:
      SIRK_AUTH_BIND_HOST: 0.0.0.0
      SIRK_AUTH_PORT: 8081
      SIRK_PUBLIC_ORIGIN: https://${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}
      SIRK_AUTH_ORIGIN: ${SIRK_AUTH_ORIGIN:-}
    volumes:
      - central-data:/var/lib/sirk-central:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SIRK_UPDATER_BIND_HOST: 0.0.0.0
      SIRK_UPDATER_PORT: 8090
      SIRK_UPDATER_STATE_DIR: /var/lib/sirk-updater
      SIRK_BACKUP_SOURCE_DIR: /var/lib/sirk-central
      SIRK_BACKUP_DIR: /var/lib/sirk-updater/backups
      SIRK_BACKUP_TIME_ZONE: ${SIRK_BACKUP_TIME_ZONE:-Europe/Warsaw}
      SIRK_COMPOSE_FILE: /opt/sirk-central/docker-compose.yml
      SIRK_INSTALL_DIR: /opt/sirk-central
      SIRK_REPO_REF: ${SIRK_REPO_REF:-main}
    volumes:
      - /opt/sirk-central:/opt/sirk-central
      - ${SIRK_BUSINESS_SITE_PATH:-/opt/sir-k.pl}:${SIRK_BUSINESS_SITE_PATH:-/opt/sir-k.pl}
      - /var/run/docker.sock:/var/run/docker.sock
      - central-data:/var/lib/sirk-central
      - updater-state:/var/lib/sirk-updater
    networks:
      - internal

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      central:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SIRK_WEBSITE_DOMAIN: ${SIRK_WEBSITE_DOMAIN:-sirkportal.com}
      SIRK_CENTRAL_DOMAIN: ${SIRK_CENTRAL_DOMAIN:-central.sirkportal.com}
      SIRK_AUTH_DOMAIN: ${SIRK_AUTH_DOMAIN:-auth.sirkportal.com}
      SIRK_BUSINESS_DOMAIN: ${SIRK_BUSINESS_DOMAIN:-sir-k.pl}
      SIRK_ACME_EMAIL: ${SIRK_ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - ${SIRK_BUSINESS_SITE_PATH:-/opt/sir-k.pl}:/srv/sir-k:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge

volumes:
  central-data:
  updater-state:
  caddy-data:
  caddy-config:
