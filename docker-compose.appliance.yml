services:
  updater:
    profiles: !reset []
    restart: unless-stopped
    command: ["node", "/app/appliance-download-server.js"]
    environment:
      SIRK_UPDATER_SCRIPT: /opt/sirk-central/deploy/appliance-web-update.sh
      SIRK_COMPOSE_FILE: /opt/sirk-central/docker-compose.yml
      SIRK_COMPOSE_PROFILES: auth,maintenance

  updater-gateway:
    depends_on:
      updater:
        condition: service_healthy
