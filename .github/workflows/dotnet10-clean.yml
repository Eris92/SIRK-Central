name: SIRK Central .NET 10 Clean

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-node-free-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/dotnet10-final
          fetch-depth: 1
      - name: Apply atomic repository cleanup
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/ci.yml | sed '1d;$d;s/^          //' > /tmp/finalize-central.py
          python3 /tmp/finalize-central.py
          rm -f .github/workflows/dotnet10-clean.yml
          chmod +x install.sh reinstall.sh update.sh deploy/*.sh .github/scripts/validate-node-free-dotnet10.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Remove Node runtime and finalize SIRK Central .NET 10'
          git push origin HEAD:rewrite/dotnet10-final
