name: SIRK Central .NET 10 Clean

on:
  push:
    branches: [rewrite/dotnet10-final]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sirk-central-finalize-node-free
  cancel-in-progress: true

jobs:
  finalize-node-free-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/dotnet10-final
          fetch-depth: 1
      - name: Apply product cleanup without modifying workflows
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/ci.yml | sed '1d;$d;s/^          //' > /tmp/finalize-central.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/finalize-central.py')
          value = path.read_text(encoding='utf-8')

          workflow_start = value.index("workflow_root = root / '.github' / 'workflows'")
          documentation_start = value.index("for documentation in", workflow_start)
          workflow_replacement = '''workflow_root = root / '.github' / 'workflows'
node_markers = re.compile(
    r'actions/setup-node|\\bnpm\\s+(?:ci|test|run)|\\bnode\\s+(?:--test|src/)|'
    r'auth/server\\.js|updater-gateway|Dockerfile\\.gateway|Dockerfile\\.manager',
    re.I)
node_workflows = []
for workflow in workflow_root.glob('*.*ml'):
    if workflow.name in {'ci.yml', 'dotnet10-clean.yml'}:
        continue
    if node_markers.search(workflow.read_text(encoding='utf-8', errors='ignore')):
        node_workflows.append(workflow.as_posix())
list_path = root / '.github' / 'node-workflows-to-delete.txt'
list_path.write_text('\\n'.join(sorted(node_workflows)) + ('\\n' if node_workflows else ''), encoding='utf-8', newline='\\n')

'''
          value = value[:workflow_start] + workflow_replacement + value[documentation_start:]

          ci_start = value.index("final_ci = '''name: SIRK Central .NET 10 CI")
          ci_write = value.index("(workflow_root / 'ci.yml').write_text", ci_start)
          ci_end = value.index('\n', ci_write) + 1
          value = value[:ci_start] + value[ci_end:]

          path.write_text(value, encoding='utf-8', newline='\n')
          PY
          python3 /tmp/finalize-central.py
          chmod +x install.sh reinstall.sh update.sh deploy/*.sh .github/scripts/validate-node-free-dotnet10.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Remove Node runtime and finalize SIRK Central .NET 10'
          git push origin HEAD:rewrite/dotnet10-final
