name: SIRK Central .NET 10 WebAuthn

on:
  push:
    branches: [rewrite/dotnet10]
  pull_request:
    paths:
      - 'src/Sirk.Central/Security/WebAuthn*.cs'
      - 'src/Sirk.Central/Security/Fido2Compatibility.cs'
      - 'tests/Sirk.Central.WebAuthnTests/**'
      - 'src/Sirk.Central/Sirk.Central.csproj'
      - '.github/workflows/dotnet10-webauthn.yml'

permissions:
  contents: read

jobs:
  webauthn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/Sirk.Central.WebAuthnTests/Sirk.Central.WebAuthnTests.csproj
      - name: Build
        run: dotnet build tests/Sirk.Central.WebAuthnTests/Sirk.Central.WebAuthnTests.csproj --configuration Release --no-restore
      - name: WebAuthn credential and ceremony lifecycle
        run: dotnet run --project tests/Sirk.Central.WebAuthnTests/Sirk.Central.WebAuthnTests.csproj --configuration Release --no-build
