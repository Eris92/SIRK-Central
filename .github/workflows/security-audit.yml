name: SIRK Central Security Audit

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: central-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Validate syntax
        run: npm run check:syntax

      - name: Security and concurrency regression suite
        env:
          SIRK_CONCURRENCY_TEST_REQUESTS: '24'
        run: |
          node --test \
            test/runtime-lock.test.js \
            test/portal-command-cancellation.test.js \
            test/ticket-event-http-semantics.test.js \
            test/protocol-concurrency.test.js \
            test/updater-gateway.test.js

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate production SBOM
        run: npm sbom --omit=dev --sbom-format spdx > sirk-central-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sirk-central-sbom
          path: sirk-central-sbom.spdx.json
          retention-days: 30

      - name: Reject committed private keys and obvious literal secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI "(BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|client_secret[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9._~-]{12,}['\"]|SIRK_(SSO_SHARED_SECRET|UPDATER_TOKEN|PORTAL_TOKEN)[[:space:]]*=[[:space:]]*['\"]?[A-Za-z0-9._~-]{16,}['\"]?)" -- \
            ':!package-lock.json' ':!.github/workflows/**' ':!docs/**'; then
            echo 'Potential committed literal secret detected.' >&2
            exit 1
          fi

      - name: Reject dangerous execution patterns
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '\beval\s*\(|new Function\s*\(|child_process\.(exec|execSync)\s*\(|\bshell[[:space:]]*:[[:space:]]*true' -- \
            'src/**' 'auth/**' 'updater/**' 'public/**' || {
            echo 'Dynamic execution requires explicit review.' >&2
            exit 1
          }
          ! git grep -nE 'curl[^|]*\|[[:space:]]*(sudo[[:space:]]+)?(bash|sh)' -- 'deploy/**' 'scripts/**' 'README.md' 'docs/**' || {
            echo 'Piped remote shell execution is forbidden.' >&2
            exit 1
          }

      - name: Validate security boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) throw new Error('Package versions differ.');
          if (pkg.main !== 'src/server.js' || pkg.scripts.start !== 'node src/server.js') throw new Error('Canonical runtime entry is invalid.');

          for (const file of [
            'src/server.js','src/application.js','src/version.js','src/http/router.js','src/http/transport.js','src/modules/tickets.js','src/runtime-lock.js','src/portal-command-store.js',
            'src/ticket-projection-store.js','src/sso-callback-handler.js','src/central-operation-guard.js',
            'auth/server.js','updater/Dockerfile.gateway','updater/gateway-server.js','updater/server.js',
            'updater/backup-archive.js','updater/restore-transaction.js',
            'deploy/backup.sh','deploy/restore.sh','deploy/web-update.sh',
            'deploy/maintenance-up.sh','deploy/maintenance-down.sh','scripts/sync-main.sh',
            'scripts/validate-runtime-architecture.js','docs/RUNTIME-FLATTENING.md'
          ]) if (!fs.existsSync(file)) throw new Error('Missing security file: ' + file);

          const runtime = fs.readFileSync('src/modules/tickets.js', 'utf8');
          for (const expected of ['runtimeLockFactory.acquire','SIRK_RUNTIME_LOCK_DISABLED','eventErrorResult']) {
            if (!runtime.includes(expected)) throw new Error('Runtime hardening missing: ' + expected);
          }
          require('node:child_process').execFileSync(process.execPath, ['scripts/validate-runtime-architecture.js'], { stdio: 'inherit' });
          const gatewayDockerfile = fs.readFileSync('updater/Dockerfile.gateway', 'utf8');
          if (!gatewayDockerfile.includes('USER node') || /docker-cli|\bgit\b|\btar\b/.test(gatewayDockerfile)) throw new Error('Gateway image is not minimal/non-root.');
          const gateway = fs.readFileSync('updater/gateway-server.js', 'utf8');
          for (const expected of ['UPDATER_MAINTENANCE_REQUIRED','pathAllowed','workerOrigin','AbortSignal.timeout']) {
            if (!gateway.includes(expected)) throw new Error('Gateway hardening missing: ' + expected);
          }
          const compose = fs.readFileSync('docker-compose.yml', 'utf8');
          for (const expected of [
            'SIRK_UPDATER_ORIGIN: http://updater-gateway:8092',
            'SIRK_UPDATER_ALLOWED_HOSTS: updater-gateway',
            'dockerfile: updater/Dockerfile.gateway',
            'profiles: ["maintenance"]','restart: "no"'
          ]) if (!compose.includes(expected)) throw new Error('Compose security boundary missing: ' + expected);
          const configure = fs.readFileSync('deploy/configure-and-start.sh', 'utf8');
          if (!configure.includes('SERVICES=(central auth updater-gateway backup-manager caddy)')) throw new Error('Installer service boundary is invalid.');
          const backup = fs.readFileSync('deploy/backup.sh', 'utf8');
          if (!backup.includes('SIRK_BACKUP_REQUIRE_ENCRYPTION:-auto')) throw new Error('Offline backup encryption is not fail-closed.');
          const restore = fs.readFileSync('deploy/restore.sh', 'utf8');
          if (!restore.includes('validate-backup-archive.py') || !restore.includes('BASE_SERVICES=(central auth updater-gateway backup-manager caddy)')) throw new Error('Restore validation/gateway contract is missing.');
          const update = fs.readFileSync('deploy/web-update.sh', 'utf8');
          for (const expected of [
            'central-data.tar.gz',
            'BASE_SERVICES=(central auth updater-gateway backup-manager caddy)',
            'Close the maintenance window to remove the privileged updater worker.'
          ]) if (!update.includes(expected)) throw new Error('Update rollback/maintenance contract is missing: ' + expected);
          if (update.includes('schedule_updater_recreate')) throw new Error('Update must not recreate the privileged worker after success.');
          NODE

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
