name: SIRK Central Security Audit

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: central-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-and-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject committed private keys and obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|client_secret[[:space:]]*[:=][[:space:]]*[A-Za-z0-9._~-]{12,}|SIRK_(SSO_SHARED_SECRET|UPDATER_TOKEN|PORTAL_TOKEN)[[:space:]]*=[[:space:]]*[A-Za-z0-9._~-]{16,})' -- \
            ':!package-lock.json' \
            ':!.github/workflows/**' \
            ':!docs/**'; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi
      - name: Security-sensitive pattern review
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '\beval\s*\(|new Function\s*\(|child_process\.(exec|execSync)\s*\(' -- 'src/**' 'updater/**' 'public/**' || {
            echo 'Dynamic execution requires explicit review.' >&2
            exit 1
          }
      - name: Validate runtime and security contracts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) throw new Error('Package versions differ.');
          if (pkg.main !== 'src/server-v15.js') throw new Error('Canonical runtime is not v15.');
          if (!String(pkg.scripts.start).includes('server-v15.js')) throw new Error('Start script is not v15.');
          const dockerfile = fs.readFileSync('Dockerfile.portal-runtime', 'utf8');
          if (!dockerfile.includes('CMD ["node", "src/server-v15.js"]')) throw new Error('Portal runtime image is not v15.');
          for (const file of [
            'src/server-v15.js',
            'src/ticket-projection-store.js',
            'src/ticket-projection-store-v2.js',
            'src/portal-command-store.js',
            'src/request-rate-limiter.js',
            'src/approval-store.js',
            'updater/backup-archive.js',
            'updater/restore-transaction.js',
            'public/approval-center-ui.js',
            'public/portal-operations-ui.js',
            'public/portal-monitoring-ui.js',
            'public/portal-monitoring-ui.css',
            'public/tickets-ui.js',
            'public/tickets-ui.css',
            'test/api-authorization.test.js',
            'test/request-rate-limiter.test.js',
            'test/ticket-projection-store.test.js',
            'test/updater-client-security.test.js'
          ]) if (!fs.existsSync(file)) throw new Error('Missing required file: ' + file);
          NODE

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
