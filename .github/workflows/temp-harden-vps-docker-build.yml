name: Temporary resilient VPS Docker build fix

on:
  push:
    paths:
      - .github/workflows/temp-harden-vps-docker-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Harden upgrade build ordering and network
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('deploy/upgrade-dotnet10-vps.sh')
          script = path.read_text(encoding='utf-8')
          old = '''# Stop only the application containers. Persistent data and certificate directories remain untouched.
docker rm -f "$CENTRAL_CONTAINER" "$CADDY_CONTAINER" 2>/dev/null || true

echo "=== Budowanie obrazu ${IMAGE_NAME} ==="
docker build \\
    --pull \\
    --no-cache \\
    --file "$SOURCE_DIR/Dockerfile.dotnet10" \\
    --tag "$IMAGE_NAME" \\
    "$SOURCE_DIR"
'''
          new = '''echo "=== Budowanie obrazu ${IMAGE_NAME} ==="
BUILD_ARGS=(
    --pull
    --network host
    --file "$SOURCE_DIR/Dockerfile.dotnet10"
    --tag "$IMAGE_NAME"
)
if [[ "${SIRK_DOCKER_NO_CACHE:-0}" == "1" ]]; then
    BUILD_ARGS+=(--no-cache)
fi
docker build "${BUILD_ARGS[@]}" "$SOURCE_DIR"

# Keep the current release online until the replacement image has built.
# Persistent data and certificate directories remain untouched.
docker rm -f "$CENTRAL_CONTAINER" "$CADDY_CONTAINER" 2>/dev/null || true
'''
          if script.count(old) != 1:
              raise SystemExit(f'Expected one legacy build block, found {script.count(old)}.')
          path.write_text(script.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Validate scripts and Central
        run: |
          bash -n deploy/upgrade-dotnet10-vps.sh
          dotnet build src/Sirk.Central/Sirk.Central.csproj -c Release --nologo
          grep -Fq -- '--network host' deploy/upgrade-dotnet10-vps.sh
          grep -Fq 'SIRK_DOCKER_NO_CACHE' deploy/upgrade-dotnet10-vps.sh
          grep -Fq 'Acquire::http::Pipeline-Depth' Dockerfile.dotnet10

      - name: Commit final fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-harden-vps-docker-build.yml
          git rm -f .github/vps-docker-build-trigger.txt || true
          git add deploy/upgrade-dotnet10-vps.sh Dockerfile.dotnet10
          git commit -m "fix: make VPS Docker upgrades resilient to slow APT networking"
          git push origin HEAD:main
