name: Temporary Portal tunnel latency optimization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply long-poll and immutable asset cache
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines)

          path = Path("src/Sirk.Central/Portals/PortalTunnelModule.cs")
          text = path.read_text(encoding="utf-8")

          pending_old = block([
              "    private readonly ConcurrentDictionary<string, PendingTunnelRequest> _pending =",
              "        new(StringComparer.Ordinal);",
          ])
          pending_new = pending_old + "\n" + block([
              "    private readonly ConcurrentDictionary<string, SemaphoreSlim> _signals =",
              "        new(StringComparer.Ordinal);",
          ])
          if text.count(pending_old) != 1:
              raise SystemExit(f"Expected one pending dictionary, found {text.count(pending_old)}.")
          text = text.replace(pending_old, pending_new, 1)

          enqueue_old = "        queue.Enqueue(request);"
          enqueue_new = block([
              "        queue.Enqueue(request);",
              "        SignalPortal(portalId);",
          ])
          if text.count(enqueue_old) != 1:
              raise SystemExit(f"Expected one enqueue point, found {text.count(enqueue_old)}.")
          text = text.replace(enqueue_old, enqueue_new, 1)

          complete_marker = "    public bool Complete(\n"
          long_poll = block([
              "    public async Task<IReadOnlyList<TunnelRequest>> PollAsync(",
              "        string portalId,",
              "        int limit,",
              "        CancellationToken cancellationToken)",
              "    {",
              "        var signal = _signals.GetOrAdd(",
              "            portalId,",
              "            static _ => new SemaphoreSlim(0, 1));",
              "        var requests = Poll(portalId, limit);",
              "        if (requests.Count > 0)",
              "        {",
              "            DrainSignal(signal);",
              "            return requests;",
              "        }",
              "",
              "        await signal.WaitAsync(TimeSpan.FromSeconds(4), cancellationToken);",
              "        return Poll(portalId, limit);",
              "    }",
              "",
              "    private void SignalPortal(string portalId)",
              "    {",
              "        var signal = _signals.GetOrAdd(",
              "            portalId,",
              "            static _ => new SemaphoreSlim(0, 1));",
              "        try",
              "        {",
              "            signal.Release();",
              "        }",
              "        catch (SemaphoreFullException)",
              "        {",
              "            // One wake-up is sufficient because a poll drains a full batch.",
              "        }",
              "    }",
              "",
              "    private static void DrainSignal(SemaphoreSlim signal)",
              "    {",
              "        while (signal.Wait(0))",
              "        {",
              "        }",
              "    }",
              "",
          ])
          if text.count(complete_marker) != 1:
              raise SystemExit(f"Expected one Complete marker, found {text.count(complete_marker)}.")
          text = text.replace(complete_marker, long_poll + complete_marker, 1)

          poll_old = "                new { requests = _relay.Poll(identity.PortalId) },"
          poll_new = block([
              "                new",
              "                {",
              "                    requests = await _relay.PollAsync(",
              "                        identity.PortalId,",
              "                        64,",
              "                        context.RequestAborted)",
              "                },",
          ])
          if text.count(poll_old) != 1:
              raise SystemExit(f"Expected one poll response, found {text.count(poll_old)}.")
          text = text.replace(poll_old, poll_new, 1)

          cache_old = block([
              "            context.Response.StatusCode = response.StatusCode;",
              "            context.Response.ContentType = response.ContentType;",
              "            context.Response.Headers.CacheControl = \"no-store\";",
          ])
          cache_new = block([
              "            context.Response.StatusCode = response.StatusCode;",
              "            context.Response.ContentType = response.ContentType;",
              "            context.Response.Headers.CacheControl = IsVersionedStaticAsset(",
              "                context.Request.Method,",
              "                portalPath,",
              "                response.StatusCode)",
              "                ? \"public, max-age=31536000, immutable\"",
              "                : \"no-store\";",
          ])
          if text.count(cache_old) != 1:
              raise SystemExit(f"Expected one proxy cache block, found {text.count(cache_old)}.")
          text = text.replace(cache_old, cache_new, 1)

          headers_old = block([
              "            foreach (var item in response.Headers)",
              "            {",
              "                if (!item.Key.Equals(\"location\", StringComparison.OrdinalIgnoreCase))",
              "                    continue;",
              "                var rewritten = RewriteLocation(item.Value.FirstOrDefault(), portalId);",
              "                if (!string.IsNullOrWhiteSpace(rewritten))",
              "                    context.Response.Headers.Location = rewritten;",
              "            }",
          ])
          headers_new = block([
              "            foreach (var item in response.Headers)",
              "            {",
              "                if (item.Key.Equals(\"location\", StringComparison.OrdinalIgnoreCase))",
              "                {",
              "                    var rewritten = RewriteLocation(item.Value.FirstOrDefault(), portalId);",
              "                    if (!string.IsNullOrWhiteSpace(rewritten))",
              "                        context.Response.Headers.Location = rewritten;",
              "                    continue;",
              "                }",
              "",
              "                if (item.Key.Equals(\"etag\", StringComparison.OrdinalIgnoreCase) ||",
              "                    item.Key.Equals(\"last-modified\", StringComparison.OrdinalIgnoreCase))",
              "                {",
              "                    context.Response.Headers[item.Key] = item.Value;",
              "                }",
              "            }",
          ])
          if text.count(headers_old) != 1:
              raise SystemExit(f"Expected one response header block, found {text.count(headers_old)}.")
          text = text.replace(headers_old, headers_new, 1)

          location_marker = "    private static string RewriteLocation(string? value, string portalId)\n"
          cache_helper = block([
              "    private static bool IsVersionedStaticAsset(",
              "        string method,",
              "        string portalPath,",
              "        int statusCode)",
              "    {",
              "        if (statusCode != StatusCodes.Status200OK ||",
              "            (!HttpMethods.IsGet(method) && !HttpMethods.IsHead(method)))",
              "        {",
              "            return false;",
              "        }",
              "",
              "        var queryIndex = portalPath.IndexOf('?');",
              "        if (queryIndex <= 0) return false;",
              "        var path = portalPath[..queryIndex];",
              "        if (!path.StartsWith(\"/assets/\", StringComparison.Ordinal)) return false;",
              "        return portalPath[(queryIndex + 1)..]",
              "            .Split('&', StringSplitOptions.RemoveEmptyEntries)",
              "            .Any(part => part.StartsWith(\"v=\", StringComparison.Ordinal) && part.Length > 2);",
              "    }",
              "",
          ])
          if text.count(location_marker) != 1:
              raise SystemExit(f"Expected one RewriteLocation marker, found {text.count(location_marker)}.")
          text = text.replace(location_marker, cache_helper + location_marker, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Build Central
        run: dotnet build src/Sirk.Central/Sirk.Central.csproj -c Release --nologo

      - name: Commit final fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-optimize-portal-tunnel-latency.yml
          git add src/Sirk.Central/Portals/PortalTunnelModule.cs
          git commit -m "perf: long-poll Portal tunnel and cache versioned assets"
          git push origin HEAD:main
