name: SIRK Central CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: central-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax validation
        run: npm run check:syntax

      - name: Validate browser security bootstrap
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const csrf = html.indexOf('src="/csrf-bootstrap.js"');
          const app = html.indexOf('src="/app.js"');
          if (csrf < 0 || app < 0 || csrf > app) {
            throw new Error('CSRF bootstrap must load before app.js');
          }
          if (!html.includes('id="mfaRecoveryForm"')) {
            throw new Error('BreakGlass MFA recovery form is missing');
          }
          NODE

      - name: Validate package metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) {
            throw new Error('package.json and package-lock.json versions differ');
          }
          if (pkg.main !== 'src/server-v15.js' || !pkg.scripts.start.includes('server-v15.js')) {
            throw new Error('Production entry point is not server-v15.js');
          }
          const dockerfile = fs.readFileSync('Dockerfile.portal-runtime', 'utf8');
          if (!dockerfile.includes('CMD ["node", "src/server-v15.js"]')) {
            throw new Error('Docker runtime is not server-v15.js');
          }
          const acceptance = fs.readFileSync('deploy/acceptance-test.sh', 'utf8');
          if (!acceptance.includes('src/server-v15.js')) {
            throw new Error('Acceptance test does not validate server-v15.js');
          }
          NODE

      - name: Unit and regression tests
        run: npm test

      - name: Validate Docker Compose
        env:
          SIRK_ADMIN_PASSWORD_HASH: scrypt$16384$8$1$dGVzdA==$dGVzdA==
          SIRK_ACCESS_KEY_HASH: sha256$dGVzdA==
          SIRK_PUBLIC_ORIGIN: https://central.example.test
          SIRK_AUTH_ORIGIN: https://auth.example.test
          SIRK_SSO_SHARED_SECRET: 012345678901234567890123456789012345678901234567
          SIRK_UPDATER_TOKEN: 012345678901234567890123456789012345678901234567
          SIRK_WEBSITE_DOMAIN: example.test
          SIRK_CENTRAL_DOMAIN: central.example.test
          SIRK_AUTH_DOMAIN: auth.example.test
          SIRK_ACME_EMAIL: admin@example.test
        run: docker compose --profile auth config >/dev/null

      - name: Scan repository for committed secrets
        run: |
          if git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|client_secret[[:space:]]*[:=][[:space:]]*[^$<{])' -- ':!package-lock.json'; then
            echo 'Potential secret committed to repository.' >&2
            exit 1
          fi
