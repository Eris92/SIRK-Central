name: Source Snapshot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-flat-runtime-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'refactor/remove-legacy-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-runtime
          fetch-depth: 0

      - name: Verify and apply flat runtime payload
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'CHECKS'
          5a9c491ce2bcb6ae64bd94b650f040640dde69b72bedaacf344d7816443f52b1  .flat-runtime-payload/fix00-0
          7882daec8b792c195542341d154fc19b05750a7d628782f5f64bd17b09367cfa  .flat-runtime-payload/f00b-00
          50922a63580a23c516ed3f0b0644192c746a39221e50ad0f6ae6a9b0a9cce866  .flat-runtime-payload/f00b-01
          70fa61a05925bb7ab5ab4689080eb827c80f3dd9aaef79b50c4a8aa7b67751d0  .flat-runtime-payload/part-01
          6a8c2b11a856611fd6cd10090979dc3eb5f3284d786d6a44d3744072ecfee944  .flat-runtime-payload/part-02
          1857ff39f0a7272f7cd5aaa243deb3e8981a31622d561a08e8d4c804e27191de  .flat-runtime-payload/part-03
          dfca6d173c8240640e7d88ad8b0d0c30639b3968b87d2aa2c1f18b25553874c5  .flat-runtime-payload/f04a-00
          a69cd26974969ef31fe9584d5008a7e5e3e62f10b92a8c5379a182a3cbb31496  .flat-runtime-payload/f04a-01
          ac640ea1468670eb1c3a06f6df2b0a27e572ff374a892eb5e85237d75d9e88cc  .flat-runtime-payload/f04b-00
          66e7dfc657ba966a880623679c8f166404fc8b668ca8c2f67156adf029f971e4  .flat-runtime-payload/f04b-01
          58aabcb0aeb924905fc435aacaf7a822087e2348faa420bd1eb0551049b48816  .flat-runtime-payload/part-05
          8dd85dbc3b6d8bcf8a178ddcf4f29fc0e515006a2df437edc75ebf5bcb7d8132  .flat-runtime-payload/part-06
          CHECKS

          cat \
            .flat-runtime-payload/fix00-0 \
            .flat-runtime-payload/f00b-00 \
            .flat-runtime-payload/f00b-01 \
            .flat-runtime-payload/part-01 \
            .flat-runtime-payload/part-02 \
            .flat-runtime-payload/part-03 \
            .flat-runtime-payload/f04a-00 \
            .flat-runtime-payload/f04a-01 \
            .flat-runtime-payload/f04b-00 \
            .flat-runtime-payload/f04b-01 \
            .flat-runtime-payload/part-05 \
            .flat-runtime-payload/part-06 \
            | base64 -d > /tmp/payload.tar.xz

          echo '499ee9078bd690bc4cb75a9e0fdba22e862020ee29d4d51457d70503c6e299ac  /tmp/payload.tar.xz' | sha256sum -c -

          rm -rf /tmp/flat-apply
          mkdir -p /tmp/flat-apply
          tar -xJf /tmp/payload.tar.xz -C /tmp/flat-apply

          while IFS= read -r path; do
            [[ -n "$path" ]] && rm -rf -- "$path"
          done < /tmp/flat-apply/deleted-files.txt

          cp -a /tmp/flat-apply/payload/. .
          rm -rf .flat-runtime-payload scripts/__pycache__
          rm -f .github/workflows/apply-flat-runtime.yml

          # GitHub Apps cannot modify workflow files through git push without
          # the workflows permission. Keep the current workflow tree here;
          # the connector updates/removes those files in a separate commit.
          git checkout HEAD -- .github/workflows

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: flatten runtime and remove backward compatibility'
          git push origin HEAD:refactor/remove-legacy-runtime
