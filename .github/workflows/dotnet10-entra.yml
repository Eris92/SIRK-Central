name: SIRK Central .NET 10 Entra

on:
  pull_request:
    paths:
      - 'src/Sirk.Central/**'
      - 'tests/Sirk.Central.EntraTests/**'
      - '.github/workflows/dotnet10-entra.yml'
  push:
    branches:
      - rewrite/dotnet10
    paths:
      - 'src/Sirk.Central/**'
      - 'tests/Sirk.Central.EntraTests/**'
      - '.github/workflows/dotnet10-entra.yml'

permissions:
  contents: read

jobs:
  entra-settings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/Sirk.Central.EntraTests/Sirk.Central.EntraTests.csproj
      - name: Build
        run: dotnet build tests/Sirk.Central.EntraTests/Sirk.Central.EntraTests.csproj --configuration Release --no-restore
      - name: Protected Entra settings lifecycle
        run: dotnet run --project tests/Sirk.Central.EntraTests/Sirk.Central.EntraTests.csproj --configuration Release --no-build
