name: SIRK Central UI E2E

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - refactor/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.54.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: find src updater scripts public test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Start deterministic UI backend
        run: |
          node test/e2e/mock-server.js > /tmp/sirk-ui-mock.log 2>&1 &
          echo $! > /tmp/sirk-ui-mock.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/api/session >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/sirk-ui-mock.log
          exit 1
      - name: Renderer isolation diagnostic
        run: npx playwright test test/e2e/ui-responsiveness.spec.js --project=chromium --reporter=line
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirk-central-ui-e2e
          path: |
            playwright-report
            test-results
            /tmp/sirk-ui-mock.log
          if-no-files-found: ignore
          retention-days: 14
