name: SIRK Central .NET 10 Organizations

on:
  push:
    branches: [rewrite/dotnet10]
  pull_request:
    paths:
      - 'src/Sirk.Central/Organizations/**'
      - 'tests/Sirk.Central.OrganizationTests/**'
      - 'src/Sirk.Central/Program.cs'
      - 'src/Sirk.Central/Sirk.Central.csproj'
      - '.github/workflows/dotnet10-organizations.yml'

permissions:
  contents: read

jobs:
  organizations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/Sirk.Central.OrganizationTests/Sirk.Central.OrganizationTests.csproj
      - name: Build
        run: dotnet build tests/Sirk.Central.OrganizationTests/Sirk.Central.OrganizationTests.csproj --configuration Release --no-restore
      - name: Organization hierarchy and Portal assignment lifecycle
        run: dotnet run --project tests/Sirk.Central.OrganizationTests/Sirk.Central.OrganizationTests.csproj --configuration Release --no-build
