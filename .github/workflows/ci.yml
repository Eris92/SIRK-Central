name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trusted-finalize-sirk-central-dotnet10
  cancel-in-progress: false

jobs:
  finalize-product-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/dotnet10-final
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply one-time Node-free product cleanup
        run: python3 tools/finalize-dotnet10.py

      - name: Validate cleaned product tree
        shell: bash
        run: |
          set -euo pipefail
          chmod +x install.sh reinstall.sh update.sh deploy/*.sh .github/scripts/validate-node-free-dotnet10.sh
          bash .github/scripts/validate-node-free-dotnet10.sh
          dotnet restore src/Sirk.Central/Sirk.Central.csproj
          dotnet build src/Sirk.Central/Sirk.Central.csproj --configuration Release --no-restore
          for project in tests/*/*.csproj; do
            dotnet run --project "$project" --configuration Release
          done

      - name: Commit product cleanup to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows
          git diff --cached --check
          git commit -m 'Remove Node runtime and finalize SIRK Central .NET 10 product tree'
          git push origin HEAD:rewrite/dotnet10-final
