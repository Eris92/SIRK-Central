name: CI

on:
  push:
    branches: [main, feat/central-production-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirk-central-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate shell scripts
        run: |
          bash -n \
            deploy/bootstrap-ubuntu.sh \
            deploy/configure-and-start.sh \
            deploy/configure-auth.sh \
            deploy/install.sh \
            deploy/reset-admin-password.sh \
            deploy/rotate-access-key.sh \
            deploy/update.sh \
            deploy/web-update.sh \
            deploy/backup.sh \
            deploy/restore.sh

      - name: Validate Node.js syntax
        run: |
          find src auth updater scripts public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

      - name: Validate package metadata and entry point
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== lock.version || pkg.version !== lock.packages[''].version) process.exit(1);
          if (pkg.main !== 'src/server-v3.js' || !String(pkg.scripts.start).includes('server-v3.js')) process.exit(1);
          const html = fs.readFileSync('public/index.html', 'utf8');
          const csrf = html.indexOf('/csrf-bootstrap.js');
          const app = html.indexOf('/app.js');
          const mfa = html.indexOf('/break-glass-mfa.js');
          if (csrf < 0 || app < 0 || mfa < 0 || csrf > app || mfa < app) process.exit(1);
          NODE
          grep -F 'CMD ["node", "src/server-v3.js"]' Dockerfile

      - name: Validate Docker Compose
        env:
          SIRK_ADMIN_PASSWORD_HASH: 'scrypt$16384$8$1$AAAAAAAAAAAAAAAAAAAAAA$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          SIRK_ACCESS_KEY_HASH: 'sha256$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          SIRK_SSO_SHARED_SECRET: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          SIRK_UPDATER_TOKEN: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          SIRK_CENTRAL_DOMAIN: central.example.com
          SIRK_WEBSITE_DOMAIN: example.com
          SIRK_ACME_EMAIL: admin@example.com
        run: docker compose --profile auth config >/dev/null
