name: SIRK Central .NET 10 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sirk-central-dotnet10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build test audit publish container and smoke
        run: bash .github/scripts/run-central-canonical-ci.sh

  central-portal-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Central Portal connection heartbeat and reverse tunnel
        run: bash .github/scripts/run-central-portal-e2e.sh

  group-agent-exe-live:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Group-bound Agent EXE installation and online device
        shell: pwsh
        run: .\.github\scripts\Run-CrossProductWindows.ps1
