name: UI Loop Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-loop-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'refactor/remove-legacy-runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Show timers and DOM observers
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE -B4 -A12 'MutationObserver|setInterval|requestAnimationFrame|queueMicrotask|\.observe\(' public --include='*.js' || true
      - name: Show duplicate UI bootstraps
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE -B3 -A8 'DOMContentLoaded|function initialize|async function initialize' public --include='*.js' || true
