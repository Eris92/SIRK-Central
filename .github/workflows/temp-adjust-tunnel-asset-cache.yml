name: Temporary safe tunnel asset cache adjustment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Use short private browser cache
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/Sirk.Central/Portals/PortalTunnelModule.cs")
          text = path.read_text(encoding="utf-8")
          old = '                ? "public, max-age=31536000, immutable"'
          new = '                ? "private, max-age=300"'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one immutable cache directive, found {text.count(old)}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Build Central
        run: dotnet build src/Sirk.Central/Sirk.Central.csproj -c Release --nologo

      - name: Commit final adjustment and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-adjust-tunnel-asset-cache.yml
          git add src/Sirk.Central/Portals/PortalTunnelModule.cs
          git commit -m "fix: use short private cache for tunnel assets"
          git push origin HEAD:main
